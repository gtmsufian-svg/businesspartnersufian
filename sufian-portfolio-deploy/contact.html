<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#bfe3f7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Contact | Sufian</title>
  <meta name="description" content="Contact Sufian by email, phone or WhatsApp and start your 3 day free trial service." />
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <canvas id="sky" aria-hidden="true"></canvas>
  <header class="site-header" id="site-header"></header>

  <main id="main" class="page">
    <div class="container">
      <div class="page-head glass">
        <h1>Contact</h1>
        <p>Tell me about your business or idea. <mark class="mark">Your first 3 days of service are free.</mark></p>
      </div>

      <div class="contact-grid">
        <section class="contact-info glass" aria-label="Contact details">
          <dl>
            <dt>Email</dt>
            <dd><a data-link="email" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=gtmsufian%40gmail.com" target="_blank" rel="noopener">gtmsufian@gmail.com</a><p class="muted">Opens Gmail in a new tab</p></dd>
            <dt>Phone</dt>
            <dd><a data-link="phone" href="tel:+8801912013836">+8801912013836</a></dd>
            <dt>Social</dt>
            <dd><div class="social" data-social></div></dd>
          </dl>
        </section>

        <form class="contact-form glass" id="contact-form" autocomplete="off" novalidate>
          <h2>Send a message</h2>
          <div class="field">
            <label for="f-name">Your name</label>
            <input id="f-name" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" />
            <p class="field-error" id="f-name-error" role="alert"></p>
          </div>
          <div class="field">
            <label for="f-message">Message</label>
            <textarea id="f-message" autocomplete="off" spellcheck="false"></textarea>
            <p class="field-error" id="f-message-error" role="alert"></p>
          </div>
          <div class="form-actions">
            <button class="btn" type="submit">Send by Gmail</button>
            <button class="btn btn-wa" type="button" id="send-whatsapp">Send on WhatsApp</button>
          </div>
          <p class="form-status" id="form-status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
